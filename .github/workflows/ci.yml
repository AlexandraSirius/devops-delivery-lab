name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test published image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/alexandrasirius/devops-delivery-lab:sha-${GITHUB_SHA}"

          docker pull "${image}"
          docker run --detach --name smoke-test --publish 8000:8000 "${image}"

          trap 'docker logs smoke-test; docker rm --force smoke-test' EXIT

          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' smoke-test)"

            if [ "${status}" = "healthy" ]; then
              curl --fail --silent http://127.0.0.1:8000/health
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              exit 1
            fi

            sleep 1
          done

          exit 1
